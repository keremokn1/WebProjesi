        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav flex-column flex-lg-row ms-auto mb-2 mb-lg-0">

  <main class="container my-4 my-md-5">
    <section class="hero-section p-4 p-md-5 mb-4">
      <h1 class="display-6 fw-bold mb-3">Kullanıcı Girişi</h1>
      <p class="mb-0">Lütfen üniversite proje hesabınız ile sisteme giriş yapınız.</p>
    </section>

    <section aria-labelledby="login-title">
      <article class="card info-card">
        <div class="card-body p-4 p-md-5">
          <h2 id="login-title" class="h3 mb-3">Login Formu</h2>
          <p class="custom-muted mb-4">E-posta ve şifre bilgilerinizi girerek devam ediniz.</p>

          <div id="hataAlert" class="alert alert-danger d-none" role="alert">
            Hatalı e-posta veya şifre!
          </div>

          <form id="loginForm" action="php/login_kontrol.php" method="POST" novalidate>
            <div class="mb-3">
              <label for="kullaniciAdi" class="form-label">E-posta</label>
              <input
                type="email"
                class="form-control"
                id="kullaniciAdi"
                name="kullaniciAdi"
                placeholder="ornek@sakarya.edu.tr"
                required
              />
            </div>

            <div class="mb-4">
              <label for="sifre" class="form-label">Şifre</label>
              <input type="password" class="form-control" id="sifre" name="sifre" required />
            </div>

            <button type="submit" class="btn btn-primary">Giriş Yap</button>
          </form>
        </div>
      </article>
    </section>
  </main>
